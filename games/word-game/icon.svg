<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2bbfdc"/>
      <stop offset="0.5" stop-color="#0e6f8a"/>
      <stop offset="1" stop-color="#05202d"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="470" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9f6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b9f6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1" >
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="0.6" stop-color="#f8efd8"/>
      <stop offset="1" stop-color="#e6d9b8"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9fbff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d9fbff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <polygon points="120,0 300,0 60,1024 -200,1024" fill="url(#shaft)"/>
  <polygon points="520,0 640,0 420,1024 240,1024" fill="url(#shaft)"/>
  <polygon points="800,0 1000,0 800,1024 540,1024" fill="url(#shaft)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- a slip further back, drifting -->
  <g transform="translate(700 205) rotate(6)" opacity="0.5">
    <rect x="-210" y="-70" width="420" height="140" rx="30" fill="#f8efd8"/>
    <rect x="-150" y="-12" width="300" height="26" rx="13" fill="#0e4a5e" opacity="0.55"/>
  </g>
  <g transform="translate(300 850) rotate(-5)" opacity="0.4">
    <rect x="-190" y="-62" width="380" height="124" rx="28" fill="#f8efd8"/>
    <rect x="-130" y="-11" width="260" height="24" rx="12" fill="#0e4a5e" opacity="0.55"/>
  </g>

  <!-- motion streaks -->
  <g stroke="url(#streak)" stroke-width="22" stroke-linecap="round">
    <line x1="820" y1="430" x2="1010" y2="404"/>
    <line x1="836" y1="520" x2="1024" y2="494"/>
    <line x1="820" y1="610" x2="990" y2="586"/>
  </g>

  <!-- the main slip -->
  <g transform="translate(470 520) rotate(-8)">
    <rect x="-352" y="-196" width="720" height="440" rx="74" fill="#021821" opacity="0.35"/>
    <rect x="-360" y="-200" width="720" height="428" rx="72" fill="#b3a37c"/>
    <rect x="-360" y="-220" width="720" height="428" rx="72" fill="url(#paper)"/>
    <rect x="-348" y="-208" width="696" height="404" rx="62" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.9"/>
    <!-- W -->
    <path d="M-236 -128 L-118 120 L0 -96 L118 120 L236 -128" fill="none" stroke="#0b2a36" stroke-width="74" stroke-linejoin="miter" stroke-miterlimit="6" stroke-linecap="butt"/>
    <path d="M-296 -128 H-176 M176 -128 H296" stroke="#0b2a36" stroke-width="30" stroke-linecap="round"/>
  </g>
</svg>
