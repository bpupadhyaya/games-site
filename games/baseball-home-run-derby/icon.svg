<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Moonshot Baseball icon: a giant moon, a ball with a comet tail climbing away, a bat swinging in from below. Original art. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b1e"/><stop offset="0.55" stop-color="#1b2a66"/><stop offset="1" stop-color="#5a3f86"/></linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fffbe8"/><stop offset="0.7" stop-color="#f3e7c4"/><stop offset="1" stop-color="#d9c690"/></radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff3c0" stop-opacity="0.8"/><stop offset="1" stop-color="#fff3c0" stop-opacity="0"/></radialGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#ffffff"/><stop offset="0.7" stop-color="#ece6d6"/><stop offset="1" stop-color="#a89f88"/></radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f8a46"/><stop offset="1" stop-color="#14502b"/></linearGradient>
    <linearGradient id="bat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9c689"/><stop offset="1" stop-color="#b98a4c"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.8"><circle cx="120" cy="140" r="4"/><circle cx="300" cy="80" r="3"/><circle cx="880" cy="120" r="4"/><circle cx="760" cy="260" r="3"/><circle cx="200" cy="330" r="3"/><circle cx="930" cy="400" r="3"/></g>
  <circle cx="620" cy="330" r="360" fill="url(#glow)"/>
  <circle cx="620" cy="330" r="230" fill="url(#moon)"/>
  <g fill="#d3c08a" opacity="0.55"><circle cx="560" cy="270" r="40"/><circle cx="690" cy="380" r="28"/><circle cx="600" cy="420" r="20"/></g>
  <path d="M120 620 Q380 560 700 250" stroke="#fff3c0" stroke-width="26" stroke-linecap="round" fill="none" opacity="0.35"/>
