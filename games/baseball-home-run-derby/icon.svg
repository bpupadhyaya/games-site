  <circle cx="700" cy="250" r="64" fill="url(#ball)"/>
  <path d="M668 214 Q690 250 668 290 M732 214 Q710 250 732 290" stroke="#d1332a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M0 800 Q512 700 1024 800 V1024 H0 Z" fill="url(#grass)"/>
  <path d="M-40 1060 L420 640" stroke="url(#bat)" stroke-width="64" stroke-linecap="round"/>
  <path d="M-40 1060 L90 960" stroke="#1c1f26" stroke-width="70" stroke-linecap="round"/>
