<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Lo Shu Magic Square</title>
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">
  <style>
    /* Numerals and titles: Cinzel. Interface: Fredoka. Both SIL Open Font License 1.1 (fonts/*-OFL.txt). */
    @font-face { font-family: "Cinzel"; src: url("./fonts/Cinzel.woff2") format("woff2"); font-weight: 400 900; font-display: swap; }
    @font-face { font-family: "Fredoka"; src: url("./fonts/Fredoka.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }
    .font-warm { position: absolute; left: -999px; top: 0; opacity: 0; pointer-events: none; }
    html, body { margin: 0; height: 100%; background: #06100e; overflow: hidden; overscroll-behavior: none; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <span class="font-warm" aria-hidden="true" style="font-family:Fredoka;font-weight:600">Lo Shu 0123456789 Gentle</span>
  <span class="font-warm" aria-hidden="true" style="font-family:Cinzel;font-weight:700">LO SHU MAGIC SQUARE 0123456789</span>
  <canvas id="game"></canvas>
  <script>
    /* Render at most 2x: phones report 3x, which costs frames for no visible gain. */
    (function () { var real = window.devicePixelRatio || 1; if (real > 2) Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; } }); })();
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
