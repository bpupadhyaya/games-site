    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#7ee8e8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7ee8e8" stop-opacity="0"/>
