      <rect x="-150" y="-230" width="300" height="420" rx="46" fill="url(#face)" stroke="#bfae80" stroke-width="5"/>
      <text x="0" y="40" font-family="'Trebuchet MS','Arial Black',Arial,sans-serif" font-weight="900" font-size="230" text-anchor="middle" fill="#1d1b26">9</text>
