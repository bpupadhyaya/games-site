<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Xiangqi</title>
  <style>
    /* Titles: Cormorant Garamond Bold. Characters on pieces and river: a subset of Noto Serif TC Bold. Both SIL Open Font License 1.1 (fonts/OFL*.txt). */
    @font-face { font-family: "Cormorant Garamond"; src: url("./fonts/CormorantGaramond-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Noto Serif XQ"; src: url("./fonts/NotoSerifTC-xq.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    /* Forces the fonts to load before the canvas first asks for them. */
    .font-warm { position: absolute; left: -999px; top: 0; opacity: 0; pointer-events: none; font-weight: 700; }
    html, body { margin: 0; height: 100%; background: #0f0605; overflow: hidden; overscroll-behavior: none; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <span class="font-warm" style="font-family:'Cormorant Garamond'" aria-hidden="true">Xiangqi 0123456789</span>
  <span class="font-warm" style="font-family:'Noto Serif XQ'" aria-hidden="true">帥仕相傌俥炮兵將士象馬車砲卒楚河漢界象棋</span>
  <canvas id="game"></canvas>
  <script>
    /* Render at most 2x: phones report 3x, which is ~2x the pixels for no visible gain and costs frames. */
    (function () { var real = window.devicePixelRatio || 1; if (real > 2) Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; } }); })();
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
