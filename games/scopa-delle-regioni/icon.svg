<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8a1f27"/>
    <stop offset="0.55" stop-color="#5e0f18"/>
    <stop offset="1" stop-color="#320810"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.36" cy="0.32" r="0.75">
    <stop offset="0" stop-color="#ffdca0" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#ffdca0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="coin" cx="0.38" cy="0.34" r="0.75">
