<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Hornussen</title>
  <style>
    /* Typeface: Barlow, SIL Open Font License 1.1 (fonts/Barlow-OFL.txt). */
    @font-face { font-family: "Barlow"; src: url("./fonts/Barlow-SemiBold.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
    @font-face { font-family: "Barlow"; src: url("./fonts/Barlow-ExtraBold.woff2") format("woff2"); font-weight: 800 900; font-display: swap; }
    /* Forces the fonts to load before the canvas first asks for them. */
    .font-warm { position: absolute; left: -999px; top: 0; font-family: "Barlow"; opacity: 0; pointer-events: none; }
    html, body { margin: 0; height: 100%; background: #10301f; overflow: hidden; overscroll-behavior: none; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <span class="font-warm" aria-hidden="true" style="font-weight:600">Hornussen 0123456789</span>
  <span class="font-warm" aria-hidden="true" style="font-weight:800">Hornussen 0123456789</span>
  <canvas id="game"></canvas>
  <script>
    /* Render at most 2x: phones report 3x, which is ~2x the pixels for no visible gain and costs frames. */
    (function () { var real = window.devicePixelRatio || 1; if (real > 2) Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; } }); })();
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
