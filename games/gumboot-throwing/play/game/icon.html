<!doctype html>
<html><head><meta charset="utf-8"><title>icon</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><script type="module">
import { createPresenter } from './view3d/presenter.js';
import { GL } from './src/glbridge.js';
const q = new URLSearchParams(location.search);
const P = await createPresenter({ standalone: true, quality: 'high' });
await P.ready_p;
P.world.setLook(+(q.get('look') || 2));
await new Promise((r) => setTimeout(r, 4000));
const opt = {};
for (const k of ['look','phi','boot','bootAng','bloom','vignette','exposure']) if (q.has(k)) opt[k] = +q.get(k);
if (q.has('cam')) opt.cam = q.get('cam').split(',').map(Number);
if (q.has('bp')) opt.bootPos = q.get('bp').split(',').map(Number);
window.__p3d = P; void GL;
P.renderIcon({ ...opt, size: +(q.get('size') || 2048) });
</script></body></html>
