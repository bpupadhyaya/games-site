<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Gilli-Danda icon: a golden-hour village sky, a flipping peg with a motion arc, a stick sweeping in from below. Original art. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a5f9a"/><stop offset="0.6" stop-color="#f0a070"/><stop offset="1" stop-color="#ffd98a"/></linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c99a62"/><stop offset="1" stop-color="#8a5f34"/></linearGradient>
    <linearGradient id="peg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dca0"/><stop offset="1" stop-color="#b8823c"/></linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9c58a"/><stop offset="1" stop-color="#a9742f"/></linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff3c0" stop-opacity="0.9"/><stop offset="1" stop-color="#fff3c0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="300" cy="640" r="380" fill="url(#sun)"/>
  <path d="M0 640 L120 560 L200 620 L300 540 L420 620 L520 570 L640 630 L760 560 L900 620 L1024 570 V700 H0 Z" fill="#a6523a"/>
  <path d="M0 700 Q512 650 1024 700 V1024 H0 Z" fill="url(#earth)"/>
  <ellipse cx="420" cy="860" rx="70" ry="26" fill="#2a180c"/>
  <path d="M430 850 Q520 300 760 250" stroke="#fff3c0" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.4" stroke-dasharray="4 36"/>
  <g transform="translate(700 270) rotate(-35)"><path d="M-110 0 Q-50 -34 0 -36 Q50 -34 110 0 Q50 34 0 36 Q-50 34 -110 0Z" fill="url(#peg)" stroke="#6a4218" stroke-width="8"/></g>
  <path d="M120 980 L600 520" stroke="#3a2a14" stroke-width="74" stroke-linecap="round" opacity="0.35"/>
  <path d="M110 970 L590 510" stroke="url(#stick)" stroke-width="64" stroke-linecap="round"/>
  <path d="M110 970 L230 860" stroke="#a8352a" stroke-width="68" stroke-linecap="round"/>
