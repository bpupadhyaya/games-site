<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="0.36" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#46295f"/>
      <stop offset="0.5" stop-color="#241442"/>
      <stop offset="1" stop-color="#0a0616"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.5" stop-color="#e9b64a"/>
      <stop offset="1" stop-color="#9a6a1e"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33204e"/>
      <stop offset="1" stop-color="#190f2c"/>
    </linearGradient>
    <radialGradient id="hi" cx="0.32" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- the woven tile: one big panel filling the mark, four heritage threads meeting at its centre -->
  <polygon points="512,90 934,512 512,934 90,512" fill="url(#tile)" stroke="url(#gold)" stroke-width="20"/>

  <g stroke-linecap="round">
    <path d="M512 512 L512 190" stroke="#e9b64a" stroke-width="86"/>
    <path d="M512 512 L834 512" stroke="#3d5fd0" stroke-width="86"/>
    <path d="M512 512 L512 834" stroke="#b5502e" stroke-width="86"/>
    <path d="M512 512 L190 512" stroke="#fdf3df" stroke-width="86"/>
  </g>

  <!-- centre medallion: where every tradition meets -->
  <circle cx="512" cy="512" r="150" fill="url(#glow)" opacity="0.55"/>
  <g fill="#ffe9a8" stroke="#7a5410" stroke-width="6">
    <path d="M512 512 L560 370 L512 300 L464 370 Z"/>
    <path d="M512 512 L654 464 L724 512 L654 560 Z"/>
    <path d="M512 512 L560 654 L512 724 L464 654 Z"/>
    <path d="M512 512 L370 464 L300 512 L370 560 Z"/>
  </g>
  <circle cx="512" cy="512" r="98" fill="#fff6d8" stroke="#7a5410" stroke-width="7"/>
  <circle cx="512" cy="512" r="44" fill="url(#tile)" opacity="0.9"/>

  <rect width="1024" height="1024" fill="url(#hi)"/>
</svg>
