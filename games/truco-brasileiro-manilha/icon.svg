<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#14a35f"/>
      <stop offset="0.6" stop-color="#0a5a38"/>
      <stop offset="1" stop-color="#043022"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a0"/>
      <stop offset="1" stop-color="#f2b705"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="1" stop-color="#efe3c2"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- flag-colour rhombus and disc -->
  <path d="M512 70 L960 512 L512 954 L64 512 Z" fill="none" stroke="#ffd23f" stroke-width="14" opacity="0.8"/>
  <circle cx="512" cy="512" r="330" fill="#1c4fa0" opacity="0.55"/>
  <!-- burst -->
  <g fill="#ffd23f" opacity="0.9">
    <polygon points="512,120 548,300 700,200 620,350 800,360 650,450 800,560 620,560 700,720 548,640 512,820 476,640 324,720 404,560 224,560 374,450 224,360 404,350 324,200 476,300"/>
  </g>
  <!-- back cards -->
  <g filter="url(#sh)">
    <g transform="translate(300 560) rotate(-18)">
      <rect x="-150" y="-215" width="300" height="430" rx="26" fill="url(#card)" stroke="#6b5a3a" stroke-width="5"/>
      <path d="M0 80 C-90 10 -70 -70 0 -30 C70 -70 90 10 0 80 Z" fill="#c8102e"/>
      <path d="M-110 -150 h60 v-14 h-60z" fill="#c8102e"/>
    </g>
    <g transform="translate(724 560) rotate(18)">
      <rect x="-150" y="-215" width="300" height="430" rx="26" fill="url(#card)" stroke="#6b5a3a" stroke-width="5"/>
      <path d="M0 -90 C40 -30 100 0 70 60 C50 85 20 60 14 40 C18 85 30 100 50 110 H-50 C-30 100 -18 85 -14 40 C-20 60 -50 85 -70 60 C-100 0 -40 -30 0 -90 Z" fill="#17120f"/>
    </g>
    <!-- front card: the Zap -->
    <g transform="translate(512 520)">
      <rect x="-180" y="-260" width="360" height="520" rx="30" fill="url(#card)" stroke="#ffc928" stroke-width="12"/>
      <text x="-130" y="-150" font-family="Georgia, serif" font-weight="800" font-size="150" fill="#17120f">4</text>
      <g fill="#17120f">
        <circle cx="0" cy="-30" r="62"/>
        <circle cx="-66" cy="64" r="62"/>
        <circle cx="66" cy="64" r="62"/>
        <path d="M-18 40 H18 L36 190 H-36 Z"/>
      </g>
    </g>
  </g>
  <rect x="14" y="14" width="996" height="996" rx="90" fill="none" stroke="#ffd23f" stroke-width="10" opacity="0.85"/>
</svg>
