<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Double Dutch</title>
  <style>
    /* Fonts: Barlow Condensed ExtraBold (display) and Barlow SemiBold (text), SIL Open Font License 1.1 (fonts/Barlow-OFL.txt). */
    @font-face { font-family: "Barlow Condensed"; src: url("./fonts/BarlowCondensed-ExtraBold.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Barlow"; src: url("./fonts/Barlow-SemiBold.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    .font-warm { position: absolute; left: -999px; top: 0; font-family: "Barlow Condensed"; font-weight: 800; opacity: 0; pointer-events: none; }
    .font-warm2 { position: absolute; left: -999px; top: 0; font-family: "Barlow"; font-weight: 600; opacity: 0; pointer-events: none; }
    html, body { margin: 0; height: 100%; background: #150b38; overflow: hidden; overscroll-behavior: none; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <span class="font-warm" aria-hidden="true">DOUBLE DUTCH PERFECT 0123456789</span>
  <span class="font-warm2" aria-hidden="true">Double Dutch the ropes 0123456789</span>
  <canvas id="game"></canvas>
  <script>
    /* Render at most 2x: phones report 3x, which costs frames for no visible gain. */
    (function () { var real = window.devicePixelRatio || 1; if (real > 2) Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; } }); })();
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
