<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Charro Lasso Roping</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <style>
    /* Typefaces: Fredoka and Dela Gothic One, SIL Open Font License 1.1 (fonts/*-OFL.txt). */
    @font-face { font-family: "Fredoka"; src: url("./fonts/Fredoka.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }
    @font-face { font-family: "Dela Gothic One"; src: url("./fonts/DelaGothicOne.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    /* Forces the fonts to load before the canvas first asks for them. */
    .font-warm { position: absolute; left: -999px; top: 0; opacity: 0; pointer-events: none; }
    html, body { margin: 0; height: 100%; background: #1c1b3a; overflow: hidden; overscroll-behavior: none; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <span class="font-warm" aria-hidden="true" style="font-family:Fredoka;font-weight:600">Charro Lasso Roping 0123456789</span>
  <span class="font-warm" aria-hidden="true" style="font-family:'Dela Gothic One'">Charro Lasso Roping 0123456789</span>
  <canvas id="game"></canvas>
  <script>
    /* Render at most 2x: phones report 3x, which is ~2x the pixels for no visible gain and costs frames. */
    (function () { var real = window.devicePixelRatio || 1; if (real > 2) Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; } }); })();
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
