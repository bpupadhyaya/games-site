<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a4713f"/><stop offset="1" stop-color="#5f3a1e"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1c5a62"/><stop offset="1" stop-color="#3a958e"/></linearGradient>
    <linearGradient id="terra" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8c3521"/><stop offset="1" stop-color="#cf7642"/></linearGradient>
    <radialGradient id="box" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#fff3d0"/><stop offset="0.55" stop-color="#e8cd8e"/><stop offset="1" stop-color="#b98f4c"/></radialGradient>
    <radialGradient id="ros" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#9a5a40"/><stop offset="0.55" stop-color="#57281a"/><stop offset="1" stop-color="#25100a"/></radialGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaea"/><stop offset="0.6" stop-color="#f0e2bd"/><stop offset="1" stop-color="#d0b57c"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="6" dy="14" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/></filter>
    <g id="pet"><ellipse cx="0" cy="-42" rx="15" ry="26"/><ellipse cx="0" cy="-42" rx="15" ry="26" transform="rotate(45)"/><ellipse cx="0" cy="-42" rx="15" ry="26" transform="rotate(90)"/><ellipse cx="0" cy="-42" rx="15" ry="26" transform="rotate(135)"/><ellipse cx="0" cy="-42" rx="15" ry="26" transform="rotate(180)"/><ellipse cx="0" cy="-42" rx="15" ry="26" transform="rotate(225)"/><ellipse cx="0" cy="-42" rx="15" ry="26" transform="rotate(270)"/><ellipse cx="0" cy="-42" rx="15" ry="26" transform="rotate(315)"/><circle r="16"/></g>
  </defs>
  <rect width="1024" height="1024" fill="url(#wood)"/>
  <g opacity="0.16" stroke="#2a1206" stroke-width="3" fill="none"><path d="M0 120C300 90 600 160 1024 110M0 300C300 270 700 330 1024 290M0 520C300 490 600 560 1024 510M0 760C300 730 700 790 1024 750M0 940C300 910 600 980 1024 930"/></g>
  <!-- points of the board, from the left edge -->
  <polygon points="0,20 700,150 0,280" fill="url(#terra)" stroke="#2a1206" stroke-width="6"/>
  <polygon points="0,300 700,430 0,560" fill="url(#teal)" stroke="#2a1206" stroke-width="6"/>
  <polygon points="0,580 700,710 0,840" fill="url(#terra)" stroke="#2a1206" stroke-width="6"/>
  <polygon points="0,860 700,990 0,1120" fill="url(#teal)" stroke="#2a1206" stroke-width="6"/>
  <g stroke="#e6c56a" stroke-width="5" opacity="0.8" fill="none"><path d="M40 150 560 150M40 430 560 430M40 710 560 710M40 990 560 990"/></g>
  <!-- checkers -->
  <g filter="url(#sh)">
    <circle cx="150" cy="150" r="118" fill="url(#box)" stroke="#8c6a30" stroke-width="7"/>
    <circle cx="150" cy="150" r="88" fill="none" stroke="#a97c3c" stroke-width="5" opacity="0.6"/>
    <use href="#pet" x="150" y="150" fill="#9a6a2a"/>
    <circle cx="150" cy="430" r="118" fill="url(#ros)" stroke="#160a05" stroke-width="7"/>
    <circle cx="150" cy="430" r="88" fill="none" stroke="#000" stroke-width="5" opacity="0.5"/>
    <use href="#pet" x="150" y="430" fill="#d8ac52"/>
    <circle cx="150" cy="710" r="118" fill="url(#box)" stroke="#8c6a30" stroke-width="7"/>
    <circle cx="150" cy="710" r="88" fill="none" stroke="#a97c3c" stroke-width="5" opacity="0.6"/>
    <use href="#pet" x="150" y="710" fill="#9a6a2a"/>
    <circle cx="380" cy="150" r="118" fill="url(#ros)" stroke="#160a05" stroke-width="7"/>
    <circle cx="380" cy="150" r="88" fill="none" stroke="#000" stroke-width="5" opacity="0.5"/>
    <use href="#pet" x="380" y="150" fill="#d8ac52"/>
  </g>
  <g fill="#fff" opacity="0.55"><ellipse cx="108" cy="104" rx="30" ry="12" transform="rotate(-38 108 104)"/><ellipse cx="108" cy="664" rx="30" ry="12" transform="rotate(-38 108 664)"/></g>
  <!-- two dice -->
  <g filter="url(#sh)">
    <g transform="translate(700 620) rotate(-14)">
      <rect x="-130" y="-122" width="260" height="260" rx="52" fill="#b89a62"/>
      <rect x="-130" y="-130" width="260" height="260" rx="52" fill="url(#ivory)" stroke="#78541e" stroke-width="6"/>
      <g fill="#22120a"><circle cx="-64" cy="-64" r="26"/><circle cx="64" cy="-64" r="26"/><circle cx="0" cy="0" r="26"/><circle cx="-64" cy="64" r="26"/><circle cx="64" cy="64" r="26"/></g>
    </g>
    <g transform="translate(610 880) rotate(12)">
      <rect x="-100" y="-92" width="200" height="200" rx="42" fill="#7a1f24"/>
      <rect x="-100" y="-100" width="200" height="200" rx="42" fill="#b53a3a" stroke="#4a0a10" stroke-width="6"/>
      <g fill="#f7e9c8"><circle cx="-48" cy="-48" r="20"/><circle cx="48" cy="48" r="20"/></g>
    </g>
  </g>
  <!-- brass corner -->
      </svg>
