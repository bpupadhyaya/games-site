<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2a2f7a"/>
      <stop offset="0.55" stop-color="#11153f"/>
      <stop offset="1" stop-color="#05071a"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fbe6ae" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#fbe6ae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="38%" cy="36%" r="70%">
      <stop offset="0" stop-color="#fff7e2"/>
      <stop offset="0.7" stop-color="#ecd9ad"/>
      <stop offset="1" stop-color="#c9b27e"/>
    </radialGradient>
    <linearGradient id="foil" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fbe6ae"/>
      <stop offset="0.3" stop-color="#e2bd72"/>
      <stop offset="0.55" stop-color="#9a7431"/>
      <stop offset="0.8" stop-color="#e2bd72"/>
      <stop offset="1" stop-color="#fff3cf"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="140" cy="170" r="5"/><circle cx="262" cy="92" r="3.5"/><circle cx="880" cy="140" r="4"/>
    <circle cx="820" cy="300" r="3"/><circle cx="110" cy="430" r="3.5"/><circle cx="930" cy="520" r="4.5"/>
    <circle cx="180" cy="760" r="3"/><circle cx="760" cy="840" r="4"/><circle cx="420" cy="120" r="3"/>
    <circle cx="610" cy="905" r="3.5"/><circle cx="90" cy="900" r="4"/>
  </g>

  <!-- the moon -->
  <circle cx="512" cy="500" r="430" fill="url(#halo)"/>
  <circle cx="512" cy="500" r="238" fill="url(#moon)"/>
  <g fill="#96824f" fill-opacity="0.22">
    <circle cx="440" cy="440" r="46"/><circle cx="592" cy="566" r="66"/><circle cx="552" cy="398" r="28"/><circle cx="420" cy="590" r="34"/>
  </g>

  <!-- the one arrow, crossing the moon -->
  <line x1="176" y1="848" x2="790" y2="234" stroke="#1a1330" stroke-opacity="0.6" stroke-width="52" stroke-linecap="round"/>
  <g filter="url(#glow)" stroke="url(#foil)" stroke-width="30" stroke-linecap="round" fill="none">
    <line x1="176" y1="848" x2="790" y2="234"/>
    <!-- fletching -->
    <line x1="176" y1="848" x2="150" y2="748"/><line x1="176" y1="848" x2="276" y2="874"/>
    <line x1="232" y1="792" x2="206" y2="692"/><line x1="232" y1="792" x2="332" y2="818"/>
    <line x1="288" y1="736" x2="262" y2="636"/><line x1="288" y1="736" x2="388" y2="762"/>
  </g>
  <path d="M 890 134 L 818 304 L 790 234 L 720 206 Z" fill="#1a1330" fill-opacity="0.6" transform="translate(0 6)"/>
  <path d="M 890 134 L 818 304 L 790 234 L 720 206 Z" fill="url(#foil)" filter="url(#glow)"/>
</svg>
