<!doctype html><html><head><meta charset="utf-8"><title>icon</title><style>html,body{margin:0;background:#000}</style></head><body>
<script type="module">
import * as V3 from './vendor3d/index.js';
import { buildWorld, CLAY_Y } from './view3d/world.js';
import { createShoeKit, createShoeMaterials, makeShoe } from './view3d/shoe.js';
const { THREE, board3d: B } = V3;
const size = +(new URLSearchParams(location.search).get('size') || 2048);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0c890);
scene.fog = new THREE.Fog(0xf2cf9a, 3.5, 14);
const world = buildWorld({ THREE, B, quality: 'high' });
// only the far pit is the subject: move the world so the far pit is at the origin
world.group.position.set(0, 0, 12.19);
scene.add(world.group);
world.setClay('#cf8a5c');
world.group.traverse((o) => { if (o.name === 'backboard' || o.name === 'platform') o.visible = false; });
// a warm sunset dome behind everything (the icon pass composites on a flat colour, so the backdrop must be geometry)
{ const c = document.createElement('canvas'); c.width = 8; c.height = 256; const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#2b3f6a'); gr.addColorStop(0.45, '#d9876a'); gr.addColorStop(0.7, '#ffcf86'); gr.addColorStop(1, '#ffe7b0'); g.fillStyle = gr; g.fillRect(0, 0, 8, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; const m = new THREE.Mesh(new THREE.PlaneGeometry(14, 6), new THREE.MeshBasicMaterial({ map: t, fog: false })); m.position.set(0, 1.2, -1.6); scene.add(m); }
const kit = createShoeKit(THREE), mats = createShoeMaterials(THREE, [{ main: 0x2f80d6 }, { main: 0xdf3d33 }]);
const ringer = makeShoe(THREE, kit, mats, 0); ringer.position.set(0.0, CLAY_Y + 0.0, 0.0); ringer.rotation.y = -0.25; scene.add(ringer);
const s2 = makeShoe(THREE, kit, mats, 1); s2.position.set(-0.13, CLAY_Y, -0.2); s2.rotation.y = 0.6; scene.add(s2);
const s3 = makeShoe(THREE, kit, mats, 0); s3.position.set(0.5, CLAY_Y + 0.0, -0.5); s3.rotation.y = -0.4; scene.add(s3);
// real size is small: bring the camera close; the stake is 36 cm
const hemi = new THREE.HemisphereLight(0xcfe0ff, 0x6a4a30, 0.9); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffd29a, 3.4); key.position.set(-1.2, 1.0, 1.4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -1, right: 1, top: 1, bottom: -1, near: 0.1, far: 8 }); key.shadow.bias = -0.0005; key.shadow.normalBias = 0.01;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xffb070, 2.2); rim.position.set(1.4, 0.8, -2); scene.add(rim);
const cam = new THREE.PerspectiveCamera(36, 1, 0.05, 40);
cam.position.set(0.3, 0.3, 0.52); cam.lookAt(0.0, 0.13, -0.03);
const canvas = document.createElement('canvas'); document.body.appendChild(canvas);
const r = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new THREE.RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.7;
// bokeh-like backdrop: warm bunting lights far behind
for (let i = 0; i < 26; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: world.T.puff, color: [0xffd27a, 0xff8a5a, 0x7ab8ff, 0xffffff][i % 4], transparent: true, opacity: 0.55, depthWrite: false })); s.position.set(-2.4 + (i * 0.37) % 4.8, 0.35 + (i * 0.13) % 0.9, -2.5 - (i % 3) * 0.3); s.scale.setScalar(0.18 + (i % 4) * 0.06); scene.add(s); }
B.renderIcon({ scene, camera: cam, size, renderer: r, background: '#f0c890', bloom: 0.25, vignette: 0.45, exposure: 1.0 });
</script></body></html>
