<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Circle Dodgeball</title>
  <style>
    /* Display font: Barlow Condensed ExtraBold; text: Barlow. SIL Open Font License 1.1 (fonts/Barlow-OFL.txt). */
    @font-face { font-family: "Barlow"; src: url("./fonts/Barlow-SemiBold.woff2") format("woff2"); font-weight: 400 800; font-display: swap; }
    @font-face { font-family: "Barlow Condensed"; src: url("./fonts/BarlowCondensed-ExtraBold.woff2") format("woff2"); font-weight: 400 900; font-display: swap; }
    /* Forces the fonts to load before the canvas first asks for them. */
    .font-warm { position: absolute; left: -999px; top: 0; opacity: 0; pointer-events: none; }
    .font-warm b { font-family: "Barlow"; } .font-warm u { font-family: "Barlow Condensed"; text-decoration: none; }
    html, body { margin: 0; height: 100%; background: #0e1730; overflow: hidden; overscroll-behavior: none; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <span class="font-warm" aria-hidden="true"><b>Circle Dodgeball Queimada 0123456789</b><u>CIRCLE DODGEBALL BURNED CAUGHT 0123456789</u></span>
  <canvas id="game"></canvas>
  <script>
    /* Render at most 2x: phones report 3x, which costs frames for no visible gain. */
    (function () { var real = window.devicePixelRatio || 1; if (real > 2) Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; } }); })();
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
