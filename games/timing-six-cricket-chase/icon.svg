      <stop offset="0.38" stop-color="#7a5aa0"/>
      <stop offset="0.62" stop-color="#f08a68"/>
      <stop offset="0.82" stop-color="#ffc77a"/>
      <stop offset="1" stop-color="#ffe3a0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
