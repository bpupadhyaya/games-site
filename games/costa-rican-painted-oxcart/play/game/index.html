<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <meta name="theme-color" content="#1d0f08">
  <title>Costa Rican Painted Oxcart</title>
  <style>
    /* Titles: Dela Gothic One; text: Barlow. Both SIL Open Font License 1.1 (fonts/*-OFL.txt). */
    @font-face { font-family: "Dela Gothic One"; src: url("./fonts/DelaGothicOne.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Barlow"; src: url("./fonts/Barlow-SemiBold.woff2") format("woff2"); font-weight: 400 800; font-display: swap; }
    .font-warm { position: absolute; left: -999px; top: 0; opacity: 0; pointer-events: none; }
    .font-warm i { font-family: "Dela Gothic One"; font-style: normal; } .font-warm b { font-family: "Barlow"; }
    html, body { margin: 0; height: 100%; background: #1d0f08; overflow: hidden; overscroll-behavior: none; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <span class="font-warm" aria-hidden="true"><i>Oxcart 0123456789</i><b>Paint 0123456789</b></span>
  <canvas id="game"></canvas>
  <script>
    /* Render at most 2x: phones report 3x, which costs frames for no visible gain. */
    (function () { var real = window.devicePixelRatio || 1; if (real > 2) Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; } }); })();
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
