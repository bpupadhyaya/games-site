<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Baloot icon: a deep red table, a brass eight-point star rosette, and a large cream playing
       card bearing the Jack (the highest card in a Hokum trump suit). Full-bleed, no
       transparency, readable at 60px (bold shapes, no small text). -->
